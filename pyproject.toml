[project]
name = "crossfire"
version = "0.1.0"
description = "查证引擎：多源抓取、矛盾检测与置信度结论"
readme = "README.md"
authors = [
    { name = "Shaoheng Fan", email = "seanceazy15@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.115.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "steel-sdk>=0.19.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
crossfire = "crossfire.cli:main"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crossfire"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["crossfire", "tests/fakes.py"]
typeCheckingMode = "standard"
strict = ["crossfire/domain", "crossfire/application"]
