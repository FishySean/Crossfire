[project]
name = "crossfire"
version = "0.1.0"
description = "查证引擎：多源抓取、矛盾检测与置信度结论"
readme = "README.md"
authors = [
    { name = "Shaoheng Fan", email = "seanceazy15@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
    "steel-sdk>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crossfire"]
