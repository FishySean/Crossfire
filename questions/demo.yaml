# 矛盾类型：时间差型（旧文章仍称 3.13 为最新版）
- id: python-latest-version
  question: Python 目前的最新稳定版本是哪一个？
  sources:
    - url: https://www.python.org/downloads/
      tier: primary
    - url: https://devguide.python.org/versions/
      tier: primary
    - url: https://realpython.com/python313-new-features/
      tier: news
    - url: https://www.w3schools.com/python/python_intro.asp
      tier: aggregator

# 反例，不要用于演示。
# 实测 7 个来源、21 个配对全部 agree，置信度 0.99，没有任何可指的分歧。
# 原因在 extract 而不在 pair：有争议的话题会让模型产出自我对冲的主张，
# 例如「按 IAU 定义有 8 颗，但部分科学家主张超过 150 颗」。
# 这种主张自己内部就同时包含了两种立场，因此跟任何主张都不矛盾——
# 分歧被压进了单条主张内部，而不是存在于来源之间。
# 留在库里是为了在 slides 里当反例讲。
- id: solar-system-planet-count
  question: 太阳系有几颗行星？
  sources:
    - url: https://science.nasa.gov/solar-system/planets/
      tier: primary
    - url: https://science.nasa.gov/dwarf-planets/pluto/
      tier: primary
    - url: https://www.scientificamerican.com/article/how-many-planets-are-in-the-solar-system/
      tier: news
    - url: https://www.nbcnews.com/science/space/pluto-planet-debate-rages-rcna8848
      tier: news
    - url: https://earthsky.org/human-world/pluto-dwarf-planet-august-24-2006/
      tier: news
    - url: https://en.wikipedia.org/wiki/Planet
      tier: aggregator
    - url: https://www.enchantedlearning.com/subjects/astronomy/planets/
      tier: aggregator

