<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crossfire</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-name">Crossfire</span>
      <span class="brand-sub" id="tagline">verification results viewer</span>
    </div>
    <div class="topbar-right">
      <label class="run-picker">
        <span id="question-label">Question</span>
        <select id="question-select"></select>
      </label>
      <div class="mode-toggle" id="mode-toggle">
        <button type="button" data-mode="cached">Cached</button>
        <button type="button" data-mode="live">Live</button>
      </div>
      <button type="button" id="run-button" class="run-button">Run</button>
      <label class="run-picker">
        <span id="run-label">Run</span>
        <select id="run-select"></select>
      </label>
      <div class="lang-toggle" id="lang-toggle">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </div>
  </header>

  <div id="progress-strip" class="progress-strip hidden">
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <div class="progress-meta">
      <span id="progress-stage"></span>
      <span id="progress-timer" class="timer">0.0s</span>
    </div>
  </div>

  <div id="stall-banner" class="banner hidden">
    <span id="stall-text"></span>
    <button type="button" id="stall-switch" class="inline-button"></button>
  </div>
  <div id="failure-banner" class="banner hidden"></div>
  <div id="error-banner" class="banner error hidden"></div>

  <main id="content" class="content hidden">
    <section class="question-block">
      <div class="section-eyebrow" id="question-eyebrow">Question</div>
      <h1 id="question"></h1>
      <div id="run-meta" class="run-meta"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="sources-title">Sources</h2>
        <span id="source-count" class="count"></span>
      </div>
      <div class="sources-wrap">
        <svg id="conflict-links" class="conflict-links"></svg>
        <div id="sources" class="sources"></div>
      </div>
    </section>

    <section class="panel conflict-panel">
      <div class="panel-head">
        <h2 id="conflicts-title">Conflicts</h2>
        <span id="conflict-count" class="count"></span>
        <span id="pair-progress" class="count pair-progress hidden"></span>
      </div>
      <div id="conflicts" class="conflicts"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2 id="judgment-title">Verdict</h2></div>
      <div id="judgment" class="judgment"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
